server:
  port: 8000
# Tomcat metrics enabled
# Spring Cloud for AWS Micrometer CloudWatch Metrics Integration Enabled if local testing is required
#  tomcat:
#    mbeanregistry:
#      enabled: true
spring:
  sql:
    init:
      platform: h2
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Spring Security Basic Authentication
  security:
    user:
      name: ${BACKEND_BASIC_AUTH_USERNAME:user}
      password: ${BACKEND_BASIC_AUTH_PASSWORD:password}
    # Spring Security OAuth2 Resource Server JWT Configuration
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/demo

# Spring docs enabled  for local development
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    os:
      enabled: true
    java:
      enabled: true
#  endpoint:
#    env:
#      show-values: always
# Spring Cloud for AWS Micrometer CloudWatch Metrics Integration Enabled if local testing is required
#  cloudwatch:
#    metrics:
#      export:
#        enabled: true

logging:
  level:
    org.springframework: INFO
    org.springframework.jdbc: INFO
    #    org.springframework.security: TRACE
    #    org.springframework.security.oauth2: TRACE
    com.example: DEBUG
    com.example.fw.web.aspect.LogAspect: TRACE
#    software.amazon.awssdk: DEBUG
# 拡張フレームワーク機能の設定
example:
  # Dynamic Routing DataSource
  datasource:
    read:
      url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      driver-class-name: org.h2.Driver
      username: sa
      password:
    write:
      url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      driver-class-name: org.h2.Driver
      username: sa
      password:
    dynamic-routing:
      enabled: true

  # 業務APのプロパティ
  # Spring Security Debug Mode
#  security:
#    debug: true
