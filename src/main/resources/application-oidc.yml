# Spring Security OAuth2 Resource Server JWT Configuration
spring:
  security:
    oauth2:
      resourceserver:
        # アクセストークンをJWT検証する場合の設定
        jwt:
          issuer-uri: http://localhost:8180/realms/demo
        # アクセストークンをイントロスペクションエンドポイントで検証する場合の設定
        opaquetoken:
          introspection-uri: http://localhost:8180/realms/demo/protocol/openid-connect/token/introspect
          client-id: ${KEYCLOAK_CLIENT_ID}
          client-secret: ${KEYCLOAK_CLIENT_SECRET}
  config:
    import:
      - optional:aws-parameterstore:/config/${PROJECT_NAME}/${ENV_NAME}/oidc/common/;/config/${PROJECT_NAME}/${ENV_NAME}/oidc/${spring.application.name}/
      - optional:aws-secretsmanager:${KEYCLOAK_SECRETS_NAME}?prefix=spring.security.oauth2.resourceserver.opaquetoken.
logging:
  level:
    org.springframework.security.oauth2: TRACE
    org.springframework.web.client: TRACE

# OIDC/OAuth認証機能の有効
example:
  oidc:
    enabled: true
